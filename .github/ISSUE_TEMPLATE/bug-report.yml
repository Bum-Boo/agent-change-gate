name: Bug report
description: Report a reproducible Agent Change Gate product problem without vault content.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Agent Change Gate. Do not paste prompts, note text, model output, credentials, absolute paths, launch commands, or vulnerability details. Report security issues through [GitHub private vulnerability reporting](https://github.com/Bum-Boo/agent-change-gate/security/advisories/new).
  - type: checkboxes
    id: safety
    attributes:
      label: Safe report confirmation
      options:
        - label: I reproduced this in a disposable vault or verified copy.
          required: true
        - label: This report contains no sensitive vault content, credentials, absolute paths, or raw logs.
          required: true
        - label: This is not a security vulnerability report.
          required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, Obsidian, agent, and operating-system versions only.
      placeholder: Agent Change Gate 0.2.0; Obsidian 1.13.6; Hermes 0.20.0; Windows 11
    validations:
      required: true
  - type: dropdown
    id: flow
    attributes:
      label: Affected flow
      options:
        - Agent discovery or initialization
        - Single-note Ask
        - Single-note edit review or apply
        - Vault Batch Review
        - Undo or recovery
        - Settings, receipts, or deletion
        - Packaging or installation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic filenames and content descriptions; never paste real note text.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include a diagnostic code such as ACG-ACP-TIMEOUT when shown, but no raw error text.
    validations:
      required: true
  - type: dropdown
    id: write-impact
    attributes:
      label: Note-write impact
      options:
        - No note write was attempted
        - The plugin safely blocked the write
        - A reviewed write was applied as expected
        - An unexpected note or scope changed
        - Possible data loss or later edit overwrite
    validations:
      required: true
