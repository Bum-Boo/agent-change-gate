name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate tag
        run: test "${GITHUB_REF_NAME}" = "$(node -p "require('./manifest.json').version")"
      - name: Validate public release truth
        run: npm run validate:public-release
      - run: npm run package
      - name: Create plugin archive
        run: cd dist && zip -r ../agent-change-gate-${GITHUB_REF_NAME}.zip main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md LICENSES docs README.md PRIVACY.md SECURITY.md
      - name: Create checksums
        run: cd dist && sha256sum main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md LICENSES/Apache-2.0.txt LICENSES/Zod-MIT.txt ../agent-change-gate-${GITHUB_REF_NAME}.zip | sed -e 's#LICENSES/##' -e 's#../##' > ../SHA256SUMS.txt
      - name: Publish or refresh GitHub release
        run: |
          assets=(
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
            dist/LICENSES/Apache-2.0.txt
            dist/LICENSES/Zod-MIT.txt
            "agent-change-gate-${GITHUB_REF_NAME}.zip"
            SHA256SUMS.txt
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md" --prerelease --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md" --prerelease --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
