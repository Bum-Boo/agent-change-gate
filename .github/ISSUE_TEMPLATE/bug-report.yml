name: Bug report
description: Report a reproducible Agent Change Gate problem without private note content.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Never paste vault contents, credentials, provider keys, prompts, or private agent output here.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian and operating-system versions
      placeholder: Obsidian 1.13.4 on Windows 11
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Use synthetic or redacted examples only.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all private note content, credentials, provider responses, and identifying paths.
          required: true
